[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grpo-gl"
version = "0.1.0"
description = "GRPO from scratch, and what a lenient grader teaches a small language model"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6",
    "transformers>=5.0",
    "peft>=0.19",
    "datasets>=4.0",
    "accelerate",
    "pyyaml",
    "numpy",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
